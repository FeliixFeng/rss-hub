[project]
name = "rss-hub"
version = "0.3.1"
description = "Personal RSS fetcher: crawl feeds, store items, expose polled API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[tool.uv]
package = false
